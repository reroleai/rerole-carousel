name: Publish to Instagram

on:
  workflow_dispatch:
    inputs:
      post:
        description: "Post file, e.g. posts/communication-skills.json. Leave empty for the next one in the queue"
        required: false
        default: ""
      dry_run:
        description: "Dry run (show what would be posted, post nothing)"
        type: boolean
        default: true
  # Automatic posting. Uncomment once a manual run has worked.
  # Cron is UTC: "30 13 * * 1,3,5" is Mon/Wed/Fri 13:30 UTC (19:00 IST).
  # schedule:
  #   - cron: "30 13 * * 1,3,5"

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest discover -s tests

      - name: Publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_HOST: graph.instagram.com
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/out/{slug}
          POST_FILE: ${{ inputs.post }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || format('{0}', inputs.dry_run) }}
        run: |
          args=(--next)
          if [ -n "$POST_FILE" ]; then args=("$POST_FILE"); fi
          if [ "$DRY_RUN" != "true" ]; then args+=(--publish); fi
          python publish.py "${args[@]}"

      - name: Record what was posted
        run: |
          if [ -n "$(git status --porcelain published.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add published.json
            git commit -m "chore: record published post"
            git push
          fi
